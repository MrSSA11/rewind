# Self-hosted SigNoz, declared in one file and deployed with one command.
#
#   foundryctl cast -f casting.yaml
#
# Foundry validates the required tools, generates the Docker Compose output
# into ./pours, and brings SigNoz up. Defaults give us everything Rewind
# needs:
#
#   8080  SigNoz UI and query API
#   4317  OTLP gRPC
#   4318  OTLP HTTP   <- rewind_sdk exports here
#
# Deliberately NOT enabling spec.mcp: the SigNoz MCP server binds port 8000,
# which is the port the Rewind web app uses.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    mode: docker
    flavor: compose
